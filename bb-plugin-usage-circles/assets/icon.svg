<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Two concentric circles — the same motif the rings widget itself draws
       (outer usage ring + inner time ring, see lib/render.ts).
       stroke is an opaque literal, not currentColor: BB renders the plugin
       icon as a CSS mask, and currentColor has nothing to resolve against
       inside a mask. -->
  <circle cx="12" cy="12" r="9" />
  <circle cx="12" cy="12" r="4.5" />
</svg>
