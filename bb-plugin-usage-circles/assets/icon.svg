<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <!-- Два концентрических круга — тот же мотив, что рисует сам виджет колец
       (внешнее кольцо расхода + внутреннее кольцо времени, см. lib/render.ts).
       stroke — непрозрачный литерал, а не currentColor: BB рендерит иконку
       плагина как CSS-маску, внутри маски currentColor резолвить неоткуда. -->
  <circle cx="12" cy="12" r="9" />
  <circle cx="12" cy="12" r="4.5" />
</svg>
